<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias de lo Errazuriz - Contacto y Pedidos</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <h1>Pizzería Delicias de lo Errazuriz</h1>
        <p>Haz tu Pedido en Línea</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="menu.html">Menú</a></li>
            <li><a href="contacto.html">Contacto y Pedidos</a></li>
        </ul>
    </nav>

    <main class="contenedor">
        <h2>Formulario de Pedido</h2>
        <p>Completa tus datos para enviarte la pizza a tu casa:</p>

        <form id="formulario-pedido">
            <div class="campo">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">
                <span id="error-nombre" class="mensaje-error"></span>
            </div>

            <div class="campo">
                <label for="email">Correo Electrónico:</label>
                <input type="text" id="email" name="email" placeholder="ejemplo@correo.com">
                <span id="error-email" class="mensaje-error"></span>
            </div>

            <div class="campo">
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" name="telefono" placeholder="Ej: 912345678">
                <span id="error-telefono" class="mensaje-error"></span>
            </div>

            <div class="campo">
                <label for="pizza">Selecciona tu pizza:</label>
                <select id="pizza" name="pizza">
                    <option value="">-- Selecciona una opción --</option>
                    <option value="pepperoni">Pizza Pepperoni</option>
                    <option value="margarita">Pizza Margarita</option>
                    <option value="hawaiana">Pizza Hawaiana</option>
                </select>
                <span id="error-pizza" class="mensaje-error"></span>
            </div>

            <div class="campo">
                <label for="direccion">Dirección de Entrega:</label>
                <textarea id="direccion" name="direccion" rows="3" placeholder="Escribe tu dirección completa"></textarea>
                <span id="error-direccion" class="mensaje-error"></span>
            </div>

            <button type="submit" class="boton-enviar">Enviar Pedido</button>
            <p id="mensaje-exito" class="exito"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Pizzería Delicias de lo Errazuriz - Todos los derechos reservados.</p>
    </footer>

   
    <script src="script.js"></script>
</body>
</html>
